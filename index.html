<body><h1>Homing</h1><p>Buy and sell near you, paid with PayPal. A PayPal AI Hackathon project.</p>
<p id="m">Opening the live app…</p>
<p><a href="https://github.com/useralx01/homing">Source code</a> · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p>
<script>
// The app runs on its own server; live.txt holds its current public address.
fetch('live.txt?' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
  var u = t.trim();
  if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(u)) throw 0;
  document.getElementById('m').innerHTML = 'Opening the live app: <a href="' + u + '">' + u + '</a>';
  location.replace(u + '/');
}).catch(function () { document.getElementById('m').textContent = 'The live app is restarting. Try again in a minute.'; });
</script></body></html>
